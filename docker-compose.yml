services:
  tripwire:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tripwire-cctv
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/backend/data
      - ./.env:/app/.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - APP_NAME=Tripwire CCTV Zone Intrusion
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
